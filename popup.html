<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollabFox</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="icons/icon-32.png" alt="" class="logo">
      <span class="title">CollabFox</span>
    </div>
    <span class="version">v1.0.0</span>
  </header>

  <main class="content">
    <div class="row">
      <div class="row-label">
        <span class="label-title">Compatibility Mode</span>
        <span class="label-sub" id="siteLabel">Enabled</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enableToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="info-table">
      <div class="info-row">
        <span>Target</span>
        <span class="mono">*.bbcollab.com</span>
      </div>
      <div class="info-row">
        <span>Platform</span>
        <span id="detectedPlatform" class="mono">Auto</span>
      </div>
      <div class="info-row">
        <span>Engine</span>
        <span class="mono">-moz-appearance bypass</span>
      </div>
    </div>

    <button id="reloadTabBtn" class="action-btn">Reload tab</button>
  </main>

  <footer class="footer">
    <span class="footer-love">Made with ❤️ for the Firefox community</span>
    <a href="https://bugzilla.mozilla.org/show_bug.cgi?id=2033777" target="_blank" class="footer-link">Bug 2033777</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
