<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollabFox</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-32.png" alt="" class="logo">
      <span class="title">CollabFox</span>
    </div>
    <label class="switch" title="Toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-bar" id="statusBar">
    <span class="dot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <div class="settings">
    <div class="field">
      <span>Platform</span>
      <span class="val" id="platform">—</span>
    </div>
    <div class="field">
      <span>Current tab</span>
      <span class="val" id="currentSite" title="">—</span>
    </div>
  </div>

  <button id="reloadBtn" class="reload-btn">Reload tab</button>

  <div class="footer">Made with ❤️ for the Firefox community</div>

  <script src="popup.js"></script>
</body>
</html>
