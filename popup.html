<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollabFox</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-32.png" alt="" class="logo">
      <span class="title">CollabFox</span>
    </div>
    <label class="switch" title="Toggle CollabFox">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-bar" id="statusBar">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Checking...</span>
  </div>

  <div class="settings">
    <div class="field">
      <span class="field-label">Platform</span>
      <span class="field-value" id="detectedPlatform">—</span>
    </div>
    <div class="field">
      <span class="field-label">Current tab</span>
      <span class="field-value" id="currentSite" title="">—</span>
    </div>
  </div>

  <button id="reloadTabBtn" class="reload-btn">Reload tab</button>

  <div class="footer">
    <span>Made with ❤️ for the Firefox community</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
